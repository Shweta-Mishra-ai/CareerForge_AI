[server]
maxUploadSize = 10
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
# Alert and caption text colours with at least 4.5:1 contrast on their tinted backgrounds (WCAG AA).
greenTextColor = "#0b5d2a"
redTextColor = "#9b1c1c"
blueTextColor = "#0b4a8a"
orangeTextColor = "#7a4300"
yellowTextColor = "#6b5200"
violetTextColor = "#5b21b6"
grayTextColor = "#475569"
