name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries and fonts (same as packages.txt, for PDF export)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $(grep -v '^#' packages.txt)
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check careerforge tests
      - name: Tests (unit, UI and browser end-to-end) with the coverage gate
        run: pytest --cov --cov-report=term -m "not live"
