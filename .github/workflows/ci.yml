name: CI
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for WeasyPrint (test PDFs)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation fonts-crosextra-carlito
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check careerforge tests
      - run: pytest --cov --cov-report=term-missing -m "not visual and not live"
