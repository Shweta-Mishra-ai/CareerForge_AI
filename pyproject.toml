[project]
name = "careerforge-ai"
version = "0.2.0"
description = "ATS-aware CV, portfolio and job-application toolkit"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["chrome_extension"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["S101"]  # asserts are fine; tests use them

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: browser tests (Playwright); start their own Streamlit server and need Chromium",
    "live: touches real provider APIs; needs keys, run manually",
]
xfail_strict = true

[tool.coverage.run]
source = ["careerforge"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95  # measured: 97 at the time of writing; lower only with a reason
