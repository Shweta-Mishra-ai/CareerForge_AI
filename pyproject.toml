[project]
name = "careerforge-ai"
version = "0.2.0.dev0"
description = "ATS-aware CV, portfolio and job-application toolkit"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["chrome_extension"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["S101"]  # asserts are fine; tests use them

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
# LEGACY: rewritten in later phases (see docs/MERGE_PLAN.md). Scoped exemptions so the new
# code is held to the full ruleset from day one. Delete each line when its file is replaced.
"templates/cv_styles.py" = ["E501", "E701", "F841", "I001"]  # replaced in Phase 5
"core/scraper.py" = ["E501", "S110", "S311", "I001"]         # replaced in Phase 3
"core/ai_engine.py" = ["E501", "B904", "I001"]               # replaced in Phase 2
"app.py" = ["E501", "I001"]                                   # replaced in Phase 6

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: browser tests (Playwright); need a running app and Chromium",
    "visual: screenshot/PDF baseline comparisons",
    "live: touches real provider APIs; needs keys, run manually",
]
xfail_strict = true
