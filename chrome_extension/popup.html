<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CareerForge AI</title>
  <style>
    body { width: 280px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 14px; margin: 0; color: #0f172a; background: #f8fafc; }
    h1 { font-size: 16px; margin: 0 0 6px; color: #1e3a8a; }
    p { margin: 0 0 10px; font-size: 13px; color: #334155; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover, button:focus-visible { background: #1d4ed8; }
    button:focus-visible { outline: 2px solid #1e3a8a; outline-offset: 2px; }
    #status { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; }
    #status.ok { background: #dcfce7; color: #14532d; }
    #status.warn { background: #fef3c7; color: #78350f; }
    #status.error { background: #fee2e2; color: #7f1d1d; }
    textarea { width: 100%; height: 110px; margin-top: 8px; font-size: 11px; box-sizing: border-box; }
    small { display: block; margin-top: 10px; color: #64748b; font-size: 11px; }
  </style>
</head>
<body>
  <h1>CareerForge AI</h1>
  <p>Open <b>your own</b> LinkedIn profile, then copy its text to paste into CareerForge.</p>
  <button id="extractBtn" type="button">Copy my profile text</button>
  <div id="status" role="status" aria-live="polite" hidden></div>
  <textarea id="manual" aria-label="Profile text to copy manually" hidden></textarea>
  <small>Runs only when you click. Reads this tab, sends nothing anywhere, and stores nothing.</small>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
